<div class="card shadow-sm">

  <div class="card-body">

    <div class="mb-4">

      <h2 class="person-name mb-1">

        @if (person()?.role === 'SON') {

          Thêm vợ

        } @else {

          Thêm chồng

        }

      </h2>

      <div class="text-muted">

        @if (person(); as person) {

          Cho:

          <strong>

            {{ person.fullName }}

          </strong>

          @if (person.aliasName) {

            <span>
              (tức {{ person.aliasName }})
            </span>

          }

        }

      </div>

    </div>

    <div class="row">

      <div class="col-md-8">

        <div class="mb-3">

          <label class="form-label">

            Họ tên

          </label>

          <input
            #fullNameInput
            type="text"
            class="form-control"
            [(ngModel)]="fullName">

        </div>

        <div class="mb-3">

          <label class="form-label">

            Tên gọi khác (tức)

          </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="aliasName">

        </div>

        <div class="mb-3">

          <label class="form-label">

            Năm sinh

          </label>

          <input
            type="number"
            class="form-control"
            [(ngModel)]="birthYear">

        </div>

        <div class="mb-4">

          <label class="form-label">

            Ghi chú

          </label>

          <textarea
            rows="5"
            class="form-control"
            [(ngModel)]="notes">
          </textarea>

        </div>

      </div>

    </div>

    <hr>

    <div class="d-flex gap-2">

      <button
        class="btn btn-primary"
        (click)="save()">

        Lưu

      </button>

      <button
        type="button"
        class="btn btn-outline-secondary"
        (click)="cancel()">

        Quay lại

      </button>

    </div>

  </div>

</div>
