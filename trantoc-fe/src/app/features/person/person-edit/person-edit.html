<div class="card shadow-sm">

  <div class="card-body">

    <h3 class="mb-4">
      Sửa thông tin
    </h3>

    <div class="mb-3">

      <label class="form-label">
        Họ tên
      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="fullName">

    </div>

    <div class="mb-3">

      <label class="form-label">
        Tên gọi khác (tức)
      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="aliasName">

    </div>

    <div class="row">

      <div class="col-md-6 mb-3">

        <label class="form-label">
          Năm sinh
        </label>

        <input
          type="number"
          class="form-control"
          [(ngModel)]="birthYear">

      </div>

      <div class="col-md-6 mb-3">

        <label class="form-label">
          Năm mất
        </label>

        <input
          type="number"
          class="form-control"
          [(ngModel)]="deathYear">

      </div>

    </div>

    <div class="mb-3">

      <label class="form-label">
        Giới tính
      </label>

      <select
        class="form-select"
        [(ngModel)]="gender">

        <option value="MALE">
          Nam
        </option>

        <option value="FEMALE">
          Nữ
        </option>

      </select>

    </div>

    <div class="mb-4">

      <label class="form-label">
        Ghi chú
      </label>

      <textarea
        rows="5"
        class="form-control"
        [(ngModel)]="notes">
      </textarea>

    </div>

    <div class="d-flex gap-2">

      <button
        type="button"
        class="btn btn-primary"
        (click)="save()">

        Lưu

      </button>

      <button
        type="button"
        class="btn btn-outline-secondary"
        (click)="cancel()">

        Quay lại

      </button>

    </div>

  </div>

</div>
